name: 音声生成（教材追加時に自動実行）

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'tools/gen_audio.py'
      - '.github/workflows/tts.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: tts
  cancel-in-progress: false

jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install edge-tts==7.*
      - run: python tools/gen_audio.py
      - name: 生成した音声をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio
          if git diff --cached --quiet; then
            echo "新しい音声はありません"; exit 0
          fi
          git commit -m "音声を自動生成"
          git pull --rebase origin main
          git push
      - name: GitHub Pages を再公開
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
