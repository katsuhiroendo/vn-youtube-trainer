name: 音声生成（教材追加時に自動実行）

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'tools/gen_audio.py'
      - '.github/workflows/tts.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: tts
  cancel-in-progress: false  # 実行中のものは止めず、順番に処理

jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # 再実行時も常に最新の状態で生成する
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install edge-tts==7.*
      - run: python tools/gen_audio.py
      - name: 生成した音声をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio
          if git diff --cached --quiet; then
            echo "新しい音声はありません"; exit 0
          fi
          git commit -m "音声を自動生成"
          # 他の実行と同時に動いた場合も、既にある音声を優先して衝突を回避
          for i in 1 2 3; do
            git pull --rebase -X ours origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1
      - name: GitHub Pages を再公開
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
